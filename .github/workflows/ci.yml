name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  julia-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: julia
      - uses: julia-actions/julia-runtest@v1
        with:
          project: julia

  derivations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Instantiate derivations environment
        run: julia --project=julia/derivations -e 'using Pkg; Pkg.instantiate()'
      - name: Run every CAS derivation script
        run: |
          set -e
          for script in julia/derivations/*.jl; do
            echo "::group::$script"
            julia --project=julia/derivations "$script"
            echo "::endgroup::"
          done

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Instantiate docs environment
        run: julia --project=docs -e 'using Pkg; Pkg.instantiate()'
      - name: Build docs (Literate.jl + Documenter.jl)
        run: julia --project=docs docs/make.jl
